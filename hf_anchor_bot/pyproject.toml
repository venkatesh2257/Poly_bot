[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-anchor-bot"
version = "0.1.0"
description = "Chainlink anchor + Polymarket book/trade state machine"
requires-python = ">=3.11"
dependencies = [
  "web3>=6.0.0",
  "httpx>=0.27.0",
]

[project.scripts]
hf-anchor-bot = "hf_anchor_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hf_anchor_bot*"]
